[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
dynamic = ["version"]
name = "makefilemenu"
readme = "README.md"
requires-python = ">= 3.9"
dependencies = [
    "attrs",
    "calf",
]
authors = [
    { name="Isaac To", email="isaac.to@gmail.com" },
]
description = "Console menu for Makefiles"
license = "MIT"
license-files = ["LICENSE"]
classifiers=[
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
]

[project.scripts]
makefilemenu = "makefilemenu:__main__.main"

[project.urls]
Homepage = "https://github.com/isaacto/makefilemenu"
Repository = "https://github.com/isaacto/makefilemenu.git"
Issues = "https://github.com/isaacto/makefilemenu/issues"

[tool.hatch.version]
source = "regex"
path = "makefilemenu/__init__.py"
